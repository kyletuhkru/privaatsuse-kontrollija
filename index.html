<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privaatsuse Kontrollija</title>
  <style>
    /* --- ÜLDINE STILISTIKA --- */
    body {
      font-family: 'Inter', sans-serif;
      background: #f4f7fa;
      margin: 0;
      padding: 0;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      padding-top: 40px;
    }
    .container {
      max-width: 480px;
      width: 90%;
      background: #fff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.1);
    }
    h1 {
      text-align: center;
      color: #222;
      margin-bottom: 16px;
      font-size: 1.8rem;
    }

    /* --- VÕIMALUSED --- */
    .option {
      display: flex;
      align-items: center;
      margin: 12px 0;
      padding: 8px;
      border-radius: 8px;
      transition: 0.2s ease;
    }
    .option:hover {
      background: #eef4ff;
    }
    .option input {
      margin-right: 12px;
      width: 18px;
      height: 18px;
    }
    label {
      font-size: 1rem;
      cursor: pointer;
    }

    /* --- NUPUD --- */
    button {
      width: 100%;
      padding: 12px;
      background: #005aff;
      color: #fff;
      border: none;
      border-radius: 8px;
      font-size: 1rem;
      cursor: pointer;
      margin-top: 20px;
      transition: 0.2s ease;
    }
    button:hover {
      background: #003ecc;
    }

    /* --- TULEMUSED --- */
    .results {
      margin-top: 24px;
      border-top: 1px solid #ddd;
      padding-top: 16px;
      font-size: 1rem;
      line-height: 1.5;
    }
    .badge {
      display: inline-block;
      padding: 6px 12px;
      background: #28a745;
      color: #fff;
      border-radius: 12px;
      font-size: 0.9rem;
      margin-top: 8px;
    }
  </style>
</head>

    </div>

    <!-- Tulemus -->
    <div class="results" id="result"></div>
  </div>
