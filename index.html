<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privaatsuse Kontrollija</title>

  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      background: #f4f6fb;
      color: #1f2937;
    }

    header {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: white;
      padding: 80px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.4rem;
      margin-bottom: 10px;
    }

    header p {
      font-size: 1.1rem;
      opacity: 0.95;
    }

    section {
      max-width: 800px;
      margin: auto;
      padding: 60px 20px;
    }

    .card {
      background: white;
      border-radius: 12px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .question {
      margin: 16px 0;
      font-size: 1.05rem;
    }

    .question input {
      transform: scale(1.3);
      margin-right: 12px;
    }

    button {
      margin-top: 20px;
      padding: 14px 26px;
      font-size: 1rem;
      border: none;
      border-radius: 10px;
      background: #2563eb;
      color: white;
      cursor: pointer;
    }

    button:hover {
      background: #1d4ed8;
    }

    .progress {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin-bottom: 25px;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transition: width 0.3s;
    }

    .result {
      text-align: center;
    }

    .score {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      font-size: 2.2rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 20px auto;
    }

    ul {
      padding-left: 20px;
    }

    footer {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 30px 20px;
      margin-top: 60px;
      font-size: 0.95rem;
    }
  </style>
</head>
<body>

<header>
  <h1>Privaatsuse Kontrollija</h1>
  <p>Kontrolli oma digiprivaatsust lihtsa testiga</p>
</header>

<section>
  <div class="card">
    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question">
      <label>
        <input type="checkbox" data-score="25">
        Kasutan kaheastmelist autentimist (2FA)
      </label>
    </div>

    <div class="question">
      <label>
        <input type="checkbox" data-score="25">
        Blokeerin jälgimisküpsised
      </label>
    </div>

    <div class="question">
      <label>
        <input type="checkbox" data-score="25">
        Kontrollin rakenduste õigusi
      </label>
    </div>

    <div class="question">
      <label>
        <input type="checkbox" data-score="25">
        Kasutan VPN-i avalikes võrkudes
      </label>
    </div>

    <button type="button" onclick="calculateScore()">
      Kontrolli privaatsust
    </button>
  </div>
</section>

<section class="result">
  <h2>Sinu privaatsuse tase</h2>
  <div class="score" id="score">0%</div>
  <p id="scoreText">Tee test ja vaata tulemust</p>

  <h3>Soovitused</h3>
  <ul id="recommendations"></ul>
</section>

<footer>
  © 2026 Privaatsuse Kontrollija
</footer>

<script>
  const checkboxes = document.querySelectorAll("input[type='checkbox']");
  const progressBar = document.getElementById("progressBar");

  checkboxes.forEach(cb => {
    cb.addEventListener("change", updateProgress);
  });

  function updateProgress() {
    const checked = document.querySelectorAll("input[type='checkbox']:checked").length;
    progressBar.style.width =
      (checked / checkboxes.length) * 100 + "%";
  }

  function calculateScore() {
    let score = 0;
    const scoreEl = document.getElementById("score");
    const scoreText = document.getElementById("scoreText");
