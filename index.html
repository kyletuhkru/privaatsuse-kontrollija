<!DOCTYPE html>
<html lang="et">
<head>
    <meta charset="UTF-8">
    <title>Privaatsuse Kontrollija</title>
</head>
<body>
    <h1>🔒 Privaatsuse Kontrollija</h1>
    <p>Märgi, milliseid privaatsusseadeid sa kasutad:</p>

    <input type="checkbox" id="cookies"> Blokeerin jälgimisküpsised<br>
    <input type="checkbox" id="2fa"> Kasutan kaheastmelist autentimist<br>
    <input type="checkbox" id="private"> Teen profiili privaatseks<br>
    <input type="checkbox" id="permissions"> Kontrollin rakenduste õigusi<br><br>

    <button onclick="kontrolli()">Kontrolli privaatsust</button>

    <h2>Tulemus:</h2>
    <p id="tulemus"></p>

    <script>
        function kontrolli() {
            let punktid = 0;

            if (document.getElementById("cookies").checked) punktid++;
            if (document.getElementById("2fa").checked) punktid++;
            if (document.getElementById("private").checked) punktid++;
            if (document.getElementById("permissions").checked) punktid++;

            let tulemus = document.getElementById("tulemus");

            if (punktid <= 1) {
                tulemus.innerHTML = "⚠️ Sinu privaatsus on ohus. Soovitatav on seadeid parandada.";
            } else if (punktid <= 3) {
                tulemus.innerHTML = "🙂 Privaatsus on keskmine, kuid saab veel parandada.";
            } else {
                tulemus.innerHTML = "✅ Väga hea! Sinu privaatsusseaded on tugevad.";
            }
        }
    </script>
</body>
</html>
