<!DOCTYPE html>
<html lang="et">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrivacyCheck – Privaatsuse Kontrollija</title>

  <style>
    /* ===== RESET ===== */
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background: #f4f6fb;
      color: #1f2933;
      line-height: 1.6;
    }

    /* ===== NAVBAR ===== */
    nav {
      position: sticky;
      top: 0;
      z-index: 100;
      background: #0f172a;
      color: white;
      padding: 14px 28px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    nav .logo {
      font-weight: 700;
      font-size: 1.2rem;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin-left: 20px;
      opacity: 0.9;
    }

    nav a:hover {
      opacity: 1;
      text-decoration: underline;
    }

    /* ===== HERO ===== */
    header {
      background: linear-gradient(135deg, #2563eb, #38bdf8);
      color: white;
      padding: 100px 20px;
      text-align: center;
    }

    header h1 {
      font-size: 2.6rem;
      margin-bottom: 12px;
    }

    header p {
      font-size: 1.2rem;
      opacity: 0.95;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 14px 32px;
      background: white;
      color: #2563eb;
      border-radius: 10px;
      font-weight: 600;
      text-decoration: none;
      transition: 0.2s;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    /* ===== SECTIONS ===== */
    section {
      max-width: 900px;
      margin: auto;
      padding: 70px 20px;
    }

    section h2 {
      font-size: 2rem;
      margin-bottom: 30px;
      text-align: center;
    }

    /* ===== TEST ===== */
    .card {
      background: white;
      border-radius: 14px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
    }

    .question {
      padding: 14px 0;
      border-bottom: 1px solid #e5e7eb;
    }

    .question:last-child {
      border-bottom: none;
    }

    .question label {
      display: flex;
      gap: 14px;
      cursor: pointer;
      font-size: 1.05rem;
    }

    .question input {
      transform: scale(1.3);
      margin-top: 4px;
    }

    /* ===== PROGRESS ===== */
    .progress {
      height: 10px;
      background: #e5e7eb;
      border-radius: 999px;
      overflow: hidden;
      margin: 25px 0;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #22c55e, #4ade80);
      transition: width 0.3s ease;
    }

    /* ===== RESULT ===== */
    .score-circle {
      width: 160px;
      height: 160px;
      margin: 30px auto;
      border-radius: 50%;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.2rem;
      font-weight: 700;
    }

    .score-text {
      text-align: center;
      font-size: 1.2rem;
      margin-bottom: 20px;
    }

    /* ===== TIPS ===== */
    .tips {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 20px;
    }

    .tips li {
      margin: 10px 0;
    }

    /* ===== FOOTER ===== */
    footer {
      background: #0f172a;
      color: white;
      text-align: center;
      padding: 30px 20px;
      margin-top: 60px;
      font-size: 0.95rem;
      opacity: 0.9;
    }

    /* ===== RESPONSIVE ===== */
    @media (max-width: 600px) {
      header h1 {
        font-size: 2rem;
      }
    }
  </style>
</head>
<body>

<!-- NAV -->
<nav>
  <div class="logo">🔐 PrivacyCheck</div>
  <div>
    <a href="#test">Test</a>
    <a href="#result">Tulemus</a>
    <a href="#tips">Soovitused</a>
  </div>
</nav>

<!-- HERO -->
<header>
  <h1>Kontrolli oma digiprivaatsust</h1>
  <p>Professionaalne hinnang sinu online-turvalisusele</p>
  <a href="#test" class="btn">Alusta testi</a>
</header>

<!-- TEST -->
<section id="test">
  <h2>Privaatsuse test</h2>

  <div class="card">
    <div class="progress">
      <div class="progress-bar" id="progressBar"></div>
    </div>

    <div class="question">
      <label><input type="checkbox" data-score="25"> Kasutan kaheastmelist autentimist (2FA)</label>
    </div>
    <div class="question">
      <label><input type="checkbox" data-score="25"> Blokeerin jälgimisküpsised</label>
    </div>
    <div class="question">
      <label><input type="checkbox" data-score="25"> Kontrollin rakenduste õigusi</label>
    </div>
    <div class="question">
      <label><input type="checkbox" data-score="25"> Kasutan VPN-i avalikes võrkudes</label>
    </div>

    <br>
    <button class="btn" onclick="calculate()">Näita tulemust</button>
  </div>
</section>

<!-- RESULT -->
<section id="result">
  <h2>Sinu privaatsuse tase</h2>
  <div class="score-circle" id="score">0%</div>
  <p class="score-text" id="scoreText">Täida test, et näha tulemust</p>
</section>

<!-- TIPS -->
<section id="tips">
  <h2>Soovitused</h2>
  <div class="tips">
    <ul id="recommendations"></ul>
  </div>
</section>

<!-- FOOTER -->
<footer>
  © 2026 PrivacyCheck · Hariduslik projekt
</footer>

<script>
  const checkboxes = document.querySelectorAll("input[type=checkbox]");
  const progressBar = document.getElementById("progressBar");

  checkboxes.forEach(cb => cb.addEventListener("change", updateProgress));

  function updateProgress() {
    const checked = document.querySelectorAll("input[type=checkbox]:checked").length;
    progressBar.style.width = (checked / checkboxes.length) * 100 + "%";
  }

  function calculate() {
    let score = 0;
    const tips = document.getElementById("recommendations");
    tips.innerHTML = "";

    checkboxes.forEach(cb => {
      if (cb.checked) score += Number(cb.dataset.score);
    });

    document.getElementById("score").innerText = score + "%";

    const text = document.getElementById("scoreText");

    if (score >= 75) {
      text.innerText = "Väga tugev privaatsus 💪";
      tips.innerHTML = "<li>Jätka samas vaimus – oled hästi kaitstud.</li>";
    } else if (score >= 50) {
      text.innerText = "Keskmine privaatsus ⚠️";
      tips.innerHTML = `
        <li>Lülita sisse 2FA kõikjal</li>
        <li>Kasuta VPN-i</li>
      `;
    } else {
      text.innerText = "Nõrk privaatsus ❗";
      tips.innerHTML = `
        <li>Kasuta tugevaid paroole</li>
        <li>Lülita sisse 2FA</li>
        <li>Kontrolli rakenduste õigusi</li>
      `;
    }

    localStorage.setItem("privacyScore", score);
  }
</script>

</body>
</html>
